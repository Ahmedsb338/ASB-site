<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASB Workforce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%232457F5'/%3E%3Cpath d='M23 75 48 21 73 75' fill='none' stroke='%23fff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40.5 61 46.5 67 57.5 53' fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
html{color-scheme:light}body{margin:0}
/* Same identity as the mobile app: Cairo, brand blue, white surfaces, 14-18px radii, soft borders. Layout: sticky bar, split hero with phones, then full-width bands. */
:root{
  --bg:#F6F8FC; --surface:#FFFFFF; --ink:#0F172A; --muted:#5B6780; --line:#E2E8F3;
  --brand:#2457F5; --brand-2:#1B45D6; --on-brand:#FFFFFF; --soft:#EAF0FF; --ok:#059669; --warn:#D97706;
  --nav:rgba(246,248,252,.86); --shadow:0 24px 60px -30px rgba(36,87,245,.45);
  --f:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#162033; --ink:#F1F5F9; --muted:#94A3B8; --line:#2A3650; --brand:#6C8DFF; --brand-2:#4F73F0; --on-brand:#0B1220; --soft:#16233F; --ok:#34D399; --warn:#FBBF24; --nav:rgba(11,18,32,.86); --shadow:0 24px 60px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#162033; --ink:#F1F5F9; --muted:#94A3B8; --line:#2A3650; --brand:#6C8DFF; --brand-2:#4F73F0; --on-brand:#0B1220; --soft:#16233F; --ok:#34D399; --warn:#FBBF24; --nav:rgba(11,18,32,.86); --shadow:0 24px 60px -30px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:800;line-height:1.25;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.bar .in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
nav.links{display:flex;gap:22px;margin-inline-start:20px;font-size:15px;font-weight:600}
nav.links a{text-decoration:none;color:var(--muted)}nav.links a:hover{color:var(--brand)}
.spacer{flex:1}
.pill-btn{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}
.pill-btn:hover{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn[aria-disabled=true]{opacity:.6;pointer-events:none}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:64px 72px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--brand);font-weight:700;font-size:14px;border-radius:999px;padding:4px 14px}
.hero h1{font-size:clamp(34px,5.6vw,58px);margin-top:18px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--brand)}
.lead{margin-top:18px;font-size:19px;color:var(--muted);max-width:56ch}
.stores{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.meta{margin-top:12px;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.chips span{font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px}

/* phones (illustrative) */
.stage{position:relative;min-height:520px;display:grid;place-items:center}
.glow{position:absolute;inset:8% 4%;background:radial-gradient(60% 60% at 50% 50%,var(--soft),transparent 70%);z-index:0}
.phone{position:absolute;width:236px;background:var(--surface);border:1px solid var(--line);border-radius:34px;padding:10px;box-shadow:var(--shadow);z-index:1}
.phone.p1{inset-inline-start:2%;top:40px;transform:rotate(-5deg);z-index:1}
.phone.p2{inset-inline-end:2%;top:0;transform:rotate(4deg);z-index:2}
html[dir=rtl] .phone.p1{transform:rotate(5deg)}html[dir=rtl] .phone.p2{transform:rotate(-4deg)}
.scr{background:var(--bg);border-radius:25px;overflow:hidden;border:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.hd svg{width:26px;height:26px}.hd b{display:block;font-size:12.5px;line-height:1.2}.hd small{font-size:10px;color:var(--muted);font-weight:600}
.bd{padding:10px;display:grid;gap:8px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:11.5px}
.c small{display:block;color:var(--muted);font-size:10px}
.c .big{font-size:22px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.act{background:var(--brand);color:var(--on-brand);border-radius:11px;text-align:center;font-weight:700;font-size:12px;padding:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ok{color:var(--ok);font-weight:700}.mut{color:var(--muted)}
.radar{height:92px;display:grid;place-items:center;position:relative}
.radar i{position:absolute;border-radius:50%;border:1px solid var(--brand);opacity:.35}
.radar i:nth-child(1){width:86px;height:86px}.radar i:nth-child(2){width:58px;height:58px;opacity:.5}.radar i:nth-child(3){width:30px;height:30px;background:var(--soft);opacity:.9}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:7px 0;font-size:9.5px;color:var(--muted);font-weight:600}
.tabs .on{color:var(--brand)}
.ill{position:absolute;bottom:0;font-size:12px;color:var(--muted);z-index:3}

/* generic bands */
section{padding-block:72px}
section.alt{background:var(--surface);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-block:1px solid var(--line)}
.eyebrow{color:var(--brand);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
html[dir=rtl] .eyebrow{letter-spacing:0;text-transform:none}
.sec-t{font-size:clamp(28px,4vw,42px);margin-top:8px;max-width:24ch}
.sec-s{margin-top:14px;color:var(--muted);font-size:18px;max-width:62ch}
.grid{display:grid;gap:20px;margin-top:40px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
section.alt .card{background:var(--bg)}
.card h3{font-size:19px;margin:14px 0 6px}.card p{color:var(--muted);font-size:15px}
.ic{width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:none;stroke:var(--brand);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 10px;background:var(--soft);color:var(--brand)}
.badge.now{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
ul.chk{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;font-size:15px}
ul.chk li{display:flex;gap:10px;align-items:flex-start}
ul.chk li::before{content:"✓";color:var(--brand);font-weight:800}
ul.chk li.later{color:var(--muted)}ul.chk li.later::before{content:"○";color:var(--muted)}

/* audiences */
.aud{display:grid;gap:20px;margin-top:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.aud .card{padding:28px}.aud h3{font-size:22px;margin:0 0 6px}

/* steps */
.steps{display:grid;gap:20px;margin-top:40px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));counter-reset:s}
.st{position:relative;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--bg);counter-increment:s}
.st::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:800;margin-bottom:14px}
.st h3{font-size:18px}.st p{color:var(--muted);font-size:15px;margin-top:6px}

/* pricing */
.plans{display:grid;gap:20px;margin-top:40px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:stretch}
.plan{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;min-width:0}
.plan.pop{border:2px solid var(--brand);box-shadow:var(--shadow)}
.plan h3{font-size:22px}.plan .who{color:var(--muted);font-size:15px}
.plan .price{font-size:30px;font-weight:800;margin-top:14px;line-height:1.2}
.plan .per{font-size:14px;color:var(--muted)}
.plan .btn{margin-top:18px}
.plan ul{flex:1}
.fine{margin-top:20px;color:var(--muted);font-size:14px}

/* roadmap */
.road .card{display:flex;flex-direction:column}
.road .badge{align-self:flex-start;margin-top:14px}

/* arabic world band */
.world{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.facts{display:grid;gap:12px}
.fact{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.fact b{display:block}.fact span{color:var(--muted);font-size:15px}

/* faq */
.faq{margin-top:32px;display:grid;gap:12px;max-width:820px}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:4px 20px}
summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--brand);font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);padding-bottom:16px}

/* cta */
.cta{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);border-radius:28px;padding:56px 32px;text-align:center;display:grid;gap:16px;justify-items:center}
.cta h2{font-size:clamp(26px,4vw,40px);max-width:22ch}
.cta p{max-width:56ch;opacity:.92}
.cta .btn{background:var(--surface);color:var(--brand);border-color:var(--surface)}
.cta .btn.ghost{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.55)}
html[data-theme=dark] .cta .btn,:root:not([data-theme=light]) .cta .btn{color:var(--on-brand)}

footer{padding-block:40px 56px;color:var(--muted);font-size:14px}
footer .in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:28px}
footer a{text-decoration:none;margin-inline-end:18px}footer a:hover{color:var(--brand)}

@media (max-width:900px){
  nav.links{display:none}
  .hero{grid-template-columns:1fr;padding-block:36px 48px}
  .stage{min-height:480px}
  .world{grid-template-columns:1fr}
  section{padding-block:52px}
}
@media (max-width:480px){header.bar .in{gap:8px}.brand{white-space:nowrap;font-size:16px;gap:8px}.brand svg{width:32px;height:32px}.pill-btn{padding:0 10px;font-size:13px}.phone{width:200px}.stage{min-height:430px}.phone.p1{top:50px}}
@media (prefers-reduced-motion:no-preference){.btn,.card,.plan{transition:transform .18s,border-color .18s}.card:hover,.plan:hover{transform:translateY(-2px)}}
</style>
</head><body>

function renderLists(){
  const d=D[lang];
  const aud=$('aud'); aud.textContent='';
  d.aud.forEach(function(a,i){
    const c=el('div','card');
    c.innerHTML='<div class="ic">'+svg(['users','pin','cal'][i])+'</div><h3>'+esc(a.t)+'</h3><p>'+esc(a.d)+'</p><ul class="chk">'+a.l.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+a.later.map(function(x){return '<li class="later">'+esc(x)+'</li>';}).join('')+'</ul>';
    aud.appendChild(c);
  });
  const f=$('feat'); f.textContent='';
  d.feat.forEach(function(x){f.appendChild(el('div','card','<div class="ic">'+svg(x.i)+'</div><h3>'+esc(x.t)+'</h3><p>'+esc(x.d)+'</p>'));});

  const fa=$('facts'); fa.textContent='';

function renderDownloads(){
  const d=D[lang];

    const b=build[row[2]];
    [row[0],row[1]].forEach(function(id){const a=$(id); if(b&&b.url){a.href=b.url;a.removeAttribute('aria-disabled');a.rel='noopener';} else {a.href='#';a.setAttribute('aria-disabled','true');}});
  });

function apply(){

  $('lang').textContent=lang==='ar'?'English':'العربية'; $('theme').textContent=themeLabel();
  renderLists(); renderDownloads();
}

function usable(b){return b&&typeof b.url==='string'&&/^https:\/\/(expo\.dev|apps\.apple\.com|testflight\.apple\.com)\//.test(b.url)&&(!b.expiresAt||new Date(b.expiresAt)>new Date());}

  build={android:usable(a)?a:null, ios:usable(j.ios)?j.ios:null};
  renderDownloads();
}).catch(function(){});
