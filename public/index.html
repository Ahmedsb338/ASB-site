<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASB Workforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
html{color-scheme:light}body{margin:0}
/* Layout: one calm column system; the hero pairs a headline with a drawn phone; everything else is flat bands separated by space. */
:root{
  --bg:#F8F9FC; --surface:#FFFFFF; --ink:#12172A; --muted:#566079; --line:#E1E5F0;
  --accent:#2457F5; --accent-ink:#FFFFFF; --soft:#EDF1FD; --ok:#0B7A4B;
  --f-display:'Bricolage Grotesque','Cairo',system-ui,sans-serif; --f-body:'Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#141B30; --ink:#F2F4FA; --muted:#9AA6C0; --line:#25304A; --accent:#6C8DFF; --accent-ink:#0B1020; --soft:#131B30; --ok:#4ADE9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B30; --ink:#F2F4FA; --muted:#9AA6C0; --line:#25304A; --accent:#6C8DFF; --accent-ink:#0B1020; --soft:#131B30; --ok:#4ADE9A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[dir=rtl] body{font-size:17px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:var(--f-body);font-weight:800;line-height:1.3}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px}
html[dir=rtl] .brand{font-family:var(--f-body)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:8px}
.tools button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.tools button:hover{border-color:var(--accent)}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:48px 72px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
html[dir=rtl] .eyebrow{letter-spacing:0;text-transform:none}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.02em}
html[dir=rtl] .hero h1{letter-spacing:0}
.lead{margin-top:20px;font-size:19px;color:var(--muted);max-width:54ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.note{margin-top:14px;font-size:14px;color:var(--muted)}

/* drawn phone: illustrative only */
.phone{justify-self:center;width:min(300px,100%);background:var(--surface);border:1px solid var(--line);border-radius:36px;padding:14px;box-shadow:0 24px 60px -28px rgba(0,0,0,.35)}
.screen{background:var(--bg);border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-head .logo{width:30px;height:30px;border-radius:8px}.ph-head .logo svg{width:18px;height:18px}
.ph-head b{display:block;font-size:14px;line-height:1.2}.ph-head small{color:var(--muted);font-size:11px}
.ph-body{padding:14px;display:grid;gap:10px}
.ph-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.ph-card small{color:var(--muted);font-size:11px;display:block}
.clock{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;line-height:1.2}
.ph-btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;text-align:center;font-weight:700;padding:11px;font-size:14px}
.ph-row{display:flex;gap:8px}.ph-row .ph-card{flex:1;text-align:center;font-size:12px;font-weight:600}
.ill{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}

section{padding-block:56px;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,4vw,38px);font-weight:800;max-width:22ch}
.sub{margin-top:12px;color:var(--muted);max-width:60ch;font-size:17px}
.grid{display:grid;gap:20px;margin-top:32px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.item{padding:20px;border:1px solid var(--line);background:var(--surface);border-radius:16px;min-width:0}
.item h3{font-size:19px;margin-bottom:8px}
.item p{color:var(--muted);font-size:15px}
.ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;margin-bottom:14px}
.ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.flow{margin-top:32px;display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:44px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step i{counter-increment:s;font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.step i::before{content:counter(s)}
.step h3{font-size:18px}.step p{color:var(--muted);margin-top:4px}

.roles{margin-top:32px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.role{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.role b{font-weight:700}.role span{color:var(--muted)}

.status{margin-top:32px;display:grid;gap:12px}
.pill{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pill em{font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill em.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

.plans{margin-top:32px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.plan{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plan.feat{border:2px solid var(--accent)}
.plan h3{font-size:22px}.plan .price{font-size:15px;color:var(--muted);font-weight:600}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.plan li{display:flex;gap:8px}.plan li::before{content:"✓";color:var(--accent);font-weight:800}
.plan li.later{color:var(--muted)}.plan li.later::before{content:"○";color:var(--muted)}
.road{margin-top:32px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.road .item em{font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--accent);display:inline-block;margin-bottom:10px}
.facts{margin-top:28px;display:grid;gap:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.fact{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}.fact b{font-weight:700}.fact span{color:var(--muted);min-width:0}
nav.links{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;font-weight:600}
nav.links a{text-decoration:none;color:var(--muted)}nav.links a:hover{color:var(--accent)}
#contact{display:none}
footer{padding-block:32px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:820px){
  .fact{grid-template-columns:1fr;gap:2px}
  .hero{grid-template-columns:1fr;gap:36px;padding-block:28px 48px}
  .role{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .15s}.btn:hover{transform:translateY(-1px)}}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11c0 3-1 5-3 7M12 7a4 4 0 0 1 4 4c0 2.5-.4 4.5-1.5 6.5M8 8.5A5 5 0 0 1 12 6M6 12a6 6 0 0 1 .7-2.8M17.5 6A8 8 0 0 1 20 12c0 2-.3 3.5-1 5"/></svg></span>ASB Workforce</div>

  <main>

const root=document.documentElement; let lang='en';
try{const s=localStorage.getItem('asb-landing-lang'); if(s==='ar'||s==='en') lang=s; else if((navigator.language||'').startsWith('ar')) lang='ar';}catch(e){}
function themeLabel(){const t=root.getAttribute('data-theme'); return lang==='ar'?(t==='dark'?'فاتح':'داكن'):(t==='dark'?'Light':'Dark');}
function apply(){
  root.lang=lang; root.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=D[lang][el.dataset.i];});
  document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';
  document.getElementById('theme').textContent=themeLabel();
}
document.getElementById('lang').addEventListener('click',function(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('asb-landing-lang',lang);}catch(e){} apply();});
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme',dark?'light':'dark'); apply();
});
function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());}
tick(); setInterval(tick,1000);
document.getElementById('yr').textContent=new Date().getFullYear();
if(CONTACT_EMAIL){document.getElementById('contact').style.display='block';var m=document.getElementById('mail');m.textContent=CONTACT_EMAIL;m.href='mailto:'+CONTACT_EMAIL;}
// Latest Android build, written to latest.json by update-latest.sh after each EAS build (expired builds are never offered).
var build=null;
function dlRender(){
  var a=document.getElementById('dl'),m=document.getElementById('dlmeta');
  if(!build){a.hidden=true;m.textContent=D[lang].dlNone;return;}
  a.hidden=false;a.href=build.url;a.setAttribute('rel','noopener');
  var d=new Intl.DateTimeFormat(lang==='ar'?'ar-EG':'en-GB',{timeZone:'Africa/Cairo',dateStyle:'medium'}).format(new Date(build.createdAt));
  m.textContent=D[lang].dlMeta.replace('{v}',build.version).replace('{d}',d);
}
function renderExtra(){
  var d=D[lang],el=document.getElementById('planList');el.textContent='';
  [[1,false],[2,true],[3,false]].forEach(function(x){
    var n=x[0],c=document.createElement('div');c.className='plan'+(x[1]?' feat':'');
    var h=document.createElement('h3');h.textContent=d['plan'+n+'n'];
    var p=document.createElement('div');p.className='price';p.textContent=PRICES[n]||d['plan'+n+'p'];
    var ul=document.createElement('ul');
    (d['plan'+n+'f']||[]).forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
    (d['plan'+n+'l']||[]).forEach(function(t){var li=document.createElement('li');li.className='later';li.textContent=t;ul.appendChild(li);});
    c.appendChild(h);c.appendChild(p);c.appendChild(ul);el.appendChild(c);
  });
  var f=document.getElementById('facts');f.textContent='';
  ['A','B','C','D'].forEach(function(k){var r=document.createElement('div');r.className='fact';var b=document.createElement('b');b.textContent=d['fact'+k];var s=document.createElement('span');s.textContent=d['fact'+k+'v'];r.appendChild(b);r.appendChild(s);f.appendChild(r);});
  COMPANY.forEach(function(row){if(!row[1])return;var r=document.createElement('div');r.className='fact';var b=document.createElement('b');b.textContent=row[0][lang];var s=document.createElement('span');s.textContent=row[1];r.appendChild(b);r.appendChild(s);f.appendChild(r);});
}
var _apply=apply; apply=function(){_apply();dlRender();renderExtra();};
apply();
fetch('latest.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
  if(j&&/^https:\/\/expo\.dev\//.test(j.url)&&(!j.expiresAt||new Date(j.expiresAt)>new Date())){build=j;}
  dlRender();
}).catch(function(){dlRender();});
</script>
